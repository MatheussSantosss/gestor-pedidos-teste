<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Pedidos - Leitor Nuvem</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { background-color: #f3f4f6; }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      <i class="fa-solid fa-cloud-arrow-up text-purple-600 mr-2"></i> Leitor Nuvem iFood
    </h1>

    <!-- Botão de Captura -->
    <div class="mb-6">
      <label for="cameraInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-purple-400 rounded-xl cursor-pointer bg-purple-50 hover:bg-purple-100 transition">
        <div class="flex flex-col items-center justify-center pt-5 pb-6">
          <i class="fa-solid fa-camera text-3xl text-purple-600 mb-2"></i>
          <p class="text-sm text-purple-700 font-semibold">Tirar Foto da Comanda</p>
          <p class="text-xs text-purple-500">Leitura instantânea na nuvem</p>
        </div>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="processarFoto(event)">
      </label>
    </div>

    <!-- Indicador de Status -->
    <div id="statusOCR" class="hidden mb-6 p-4 rounded-xl bg-purple-50 text-purple-700 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-circle-notch fa-spin text-xl text-purple-600"></i>
        <span id="textoStatus" class="text-sm font-medium">A processar imagem...</span>
      </div>
    </div>

    <!-- Formulário Principal -->
    <form id="formPedido" class="space-y-4" onsubmit="salvarPedido(event)">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Localizador / ID</label>
        <input type="text" id="inputLocalizador" placeholder="Ex: 39419772 ou #1234" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Cliente</label>
        <input type="text" id="inputNome" placeholder="Ex: Leandra Silva" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Endereço de Entrega</label>
        <textarea id="inputEndereco" rows="3" placeholder="Rua, Número, Bairro..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Açaí / Itens do Pedido</label>
        <textarea id="inputAcai" rows="3" placeholder="Descrição dos itens do pedido..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
      </div>

      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-check"></i>
        <span>Confirmar e Salvar Pedido</span>
      </button>
    </form>

    <!-- Área de Depuração -->
    <div class="mt-8 border-t pt-4">
      <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Texto Lido da Foto:</h2>
      <textarea id="debugTextoLido" rows="6" readonly class="w-full p-3 bg-gray-100 text-xs text-gray-700 font-mono rounded-xl border border-gray-200" placeholder="O texto extraído da foto aparecerá aqui..."></textarea>
    </div>
  </div>

  <script>
    // Converte e comprime a foto para garantir que seja enviada corretamente
    function redimensionarImagem(file, maxDimension = 1200) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function processarFoto(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById('statusOCR');
      const textoStatus = document.getElementById('textoStatus');
      const debugBox = document.getElementById('debugTextoLido');

      statusBox.classList.remove('hidden');
      textoStatus.innerText = 'A preparar e comprimir imagem...';
      debugBox.value = 'A processar...';

      try {
        const base64Image = await redimensionarImagem(file);
        textoStatus.innerText = 'A extrair texto da comanda...';

        const formData = new FormData();
        formData.append('base64Image', base64Image);
        formData.append('apikey', 'helloworld'); // Chave pública de teste da API OCR.space
        formData.append('language', 'por');
        formData.append('isTable', 'true');
        formData.append('OCREngine', '2');

        const response = await fetch('https://api.ocr.space/parse/image', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.IsErroredOnProcessing) {
          throw new Error(data.ErrorMessage?.[0] || 'Falha ao processar a comanda');
        }

        const textoLido = data.ParsedResults?.[0]?.ParsedText || '';
        debugBox.value = textoLido || 'Nenhum texto identificado.';

        extrairDadosComanda(textoLido);

        textoStatus.innerText = 'Leitura concluída!';
        setTimeout(() => statusBox.classList.add('hidden'), 2000);

      } catch (err) {
        console.error(err);
        textoStatus.innerText = 'Erro ao processar imagem.';
        debugBox.value = 'Erro: ' + err.message;
      }
    }

    function extrairDadosComanda(texto) {
      if (!texto) return;

      const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      let localizador = '';
      let nome = '';
      let enderecoPartes = [];
      let itensPartes = [];

      let emEndereco = false;
      let emItens = false;

      for (let i = 0; i < linhas.length; i++) {
        const linha = linhas[i];
        const linhaLower = linha.toLowerCase();

        // Localizador
        if (linhaLower.includes('localizador') || linhaLower.includes('pedido')) {
          const match = linha.match(/#?\d[\d\s-]{3,}/);
          if (match) localizador = match[0].replace(/\s+/g, '');
        }

        // Nome
        if (linhaLower.includes('cliente') || linhaLower.includes('loja')) {
          if (i + 1 < linhas.length) {
            nome = linhas[i + 1];
          }
        }

        // Endereço
        if (linhaLower.includes('enderec') || linhaLower.includes('entrega')) {
          emEndereco = true;
          emItens = false;
          continue;
        }

        if (emEndereco) {
          if (linhaLower.includes('item') || linhaLower.includes('pagamento')) {
            emEndereco = false;
          } else {
            enderecoPartes.push(linha);
          }
        }

        // Itens
        if (linhaLower.includes('item') || linhaLower.includes('itens')) {
          emItens = true;
          emEndereco = false;
          continue;
        }

        if (emItens) {
          if (linhaLower.includes('total') || linhaLower.includes('pagamento')) {
            emItens = false;
          } else {
            itensPartes.push(linha);
          }
        }
      }

      if (localizador) document.getElementById('inputLocalizador').value = localizador;
      if (nome) document.getElementById('inputNome').value = nome;
      if (enderecoPartes.length > 0) document.getElementById('inputEndereco').value = enderecoPartes.join(', ');
      if (itensPartes.length > 0) document.getElementById('inputAcai').value = itensPartes.join('\n');
    }

    function salvarPedido(event) {
      event.preventDefault();
      alert('Pedido guardado com sucesso!');
    }
  </script>

</body>
</html>
