<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Pedidos - Teste Scanner</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tesseract.js (Biblioteca OCR para leitura de imagens) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    body {
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">
      <i class="fa-solid fa-receipt text-purple-600 mr-2"></i> Leitor de Comanda iFood
    </h1>

    <!-- Botão de Captura/Upload da Imagem -->
    <div class="mb-6">
      <label for="cameraInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-purple-400 rounded-xl cursor-pointer bg-purple-50 hover:bg-purple-100 transition">
        <div class="flex flex-col items-center justify-center pt-5 pb-6">
          <i class="fa-solid fa-camera text-3xl text-purple-600 mb-2"></i>
          <p class="text-sm text-purple-700 font-semibold">Tirar Foto ou Carregar Comanda</p>
          <p class="text-xs text-purple-500">Toque para abrir a câmara ou galeria</p>
        </div>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="processarImagem(event)">
      </label>
    </div>

    <!-- Indicador de Carregamento / Progresso -->
    <div id="statusOCR" class="hidden mb-6 p-4 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-circle-notch fa-spin text-xl text-blue-600"></i>
        <span id="textoStatus" class="text-sm font-medium">A ler a comanda...</span>
      </div>
      <span id="progressoOCR" class="text-xs font-bold bg-blue-200 px-2 py-1 rounded-full">0%</span>
    </div>

    <!-- Formulário com Preenchimento Automático -->
    <form id="formPedido" class="space-y-4" onsubmit="salvarPedido(event)">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Localizador</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-hashtag"></i>
          </span>
          <input type="text" id="inputLocalizador" placeholder="Ex: 39419772" class="w-full pl-10 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome do Cliente</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="inputNome" placeholder="Ex: Leandra Silva" class="w-full pl-10 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Endereço de Entrega</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-location-dot"></i>
          </span>
          <textarea id="inputEndereco" rows="3" placeholder="Rua, Número, Bairro..." class="w-full pl-10 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Açaí / Itens do Pedido</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-bowl-food"></i>
          </span>
          <textarea id="inputAcai" rows="3" placeholder="Descrição do açaí e adicionais..." class="w-full pl-10 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-purple-500 focus:outline-none"></textarea>
        </div>
      </div>

      <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-check"></i>
        <span>Confirmar e Salvar Pedido</span>
      </button>

    </form>
  </div>

  <script>
    // Processa a foto tirada pelo utilizador
    async function processarImagem(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById('statusOCR');
      const textoStatus = document.getElementById('textoStatus');
      const progressoOCR = document.getElementById('progressoOCR');

      statusBox.classList.remove('hidden');
      textoStatus.innerText = 'Iniciando leitura...';
      progressoOCR.innerText = '0%';

      try {
        // Executa o Tesseract.js em Português
        const result = await Tesseract.recognize(
          file,
          'por',
          {
            logger: m => {
              if (m.status === 'recognizing text') {
                const pct = Math.round((m.progress || 0) * 100);
                textoStatus.innerText = 'A ler comanda...';
                progressoOCR.innerText = `${pct}%`;
              }
            }
          }
        );

        const textoLido = result.data.text;
        extrairDadosDoTexto(textoLido);

        textoStatus.innerText = 'Dados extraídos com sucesso!';
        progressoOCR.innerText = '100%';
        setTimeout(() => statusBox.classList.add('hidden'), 2500);

      } catch (err) {
        console.error(err);
        textoStatus.innerText = 'Erro ao ler a comanda. Tente novamente.';
        progressoOCR.innerText = 'Erro';
      }
    }

    // Função ajustada para a comanda do iFood
    function extrairDadosDoTexto(texto) {
      console.log('Texto OCR Lido:\n', texto);

      // Divide o texto em linhas limpas
      const linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      let localizador = '';
      let nome = '';
      let enderecoPartes = [];
      let itensPartes = [];

      let lendoEndereco = false;
      let lendoItens = false;

      for (let i = 0; i < linhas.length; i++) {
        const linha = linhas[i];
        const linhaLower = linha.toLowerCase();

        // 1. EXTRAIR LOCALIZADOR
        if (linhaLower.includes('localizador:')) {
          const match = linha.match(/\d[\d\s-]{6,}\d/);
          if (match) {
            localizador = match[0].replace(/\s+/g, '');
          }
        } else if (!localizador) {
          // Busca alternativa por padrão de números do Localizador iFood (ex: 3941 9772)
          const matchId = linha.match(/\b\d{4}\s?\d{4}\b/);
          if (matchId) localizador = matchId[0].replace(/\s+/g, '');
        }

        // 2. EXTRAIR NOME DO CLIENTE
        // Na comanda do iFood, o nome fica na linha seguinte a "...pedidos na sua loja"
        if (linhaLower.includes('pedidos na sua loja') || linhaLower.includes('na sua loja')) {
          if (i + 1 < linhas.length) {
            const possivelNome = linhas[i + 1];
            // Garante que não capturou a linha de telefone ou ID
            if (!possivelNome.toLowerCase().includes('endereco') && !possivelNome.match(/^\d[\d\s-]{5,}/)) {
              nome = possivelNome;
            }
          }
        }

        // 3. EXTRAIR ENDEREÇO
        if (linhaLower.includes('endereco:') || linhaLower.includes('endereço:')) {
          lendoEndereco = true;
          lendoItens = false;
          const textoEndereco = linha.replace(/endere[cç]o:/i, '').trim();
          if (textoEndereco) enderecoPartes.push(textoEndereco);
          continue;
        }

        if (lendoEndereco) {
          // Para de ler o endereço quando chega em "ITENS DO PEDIDO" ou "Pagamento"
          if (linhaLower.includes('itens do pedido') || linhaLower.includes('pagamento')) {
            lendoEndereco = false;
          } else {
            // Guarda as linhas de endereço (Comp, Bairro, Cidade, etc.)
            enderecoPartes.push(linha);
          }
        }

        // 4. EXTRAIR AÇAÍ / ITENS DO PEDIDO
        if (linhaLower.includes('itens do pedido')) {
          lendoItens = true;
          lendoEndereco = false;
          continue;
        }

        if (lendoItens) {
          // Para de ler os itens quando chega ao bloco de pagamento
          if (linhaLower.includes('pagamento') || linhaLower.includes('valor total')) {
            lendoItens = false;
          } else {
            itensPartes.push(linha);
          }
        }
      }

      // Preenchimento automático nos campos de texto
      if (localizador) {
        document.getElementById('inputLocalizador').value = localizador.toUpperCase();
      }

      if (nome) {
        document.getElementById('inputNome').value = nome;
      }

      if (enderecoPartes.length > 0) {
        document.getElementById('inputEndereco').value = enderecoPartes.join(', ');
      }

      if (itensPartes.length > 0) {
        document.getElementById('inputAcai').value = itensPartes.join(' | ');
      }
    }

    function salvarPedido(event) {
      event.preventDefault();
      alert('Pedido processado com sucesso!');
    }
  </script>

</body>
</html>
